; Image defaults for PHP: loaded after opcache-recommended.ini (these win) and
; before the chart's zz-chart.ini (chart wins).
; ${VAR} values come from the environment; defaults are set in the Dockerfile.
expose_php = Off
memory_limit = ${PHP_MEMORY_LIMIT}
realpath_cache_size = 2M
realpath_cache_ttl = 600

; Sized from opcache_get_status() on core + a large commercial theme + these plugins, sk_SK
; measured: ~630 scripts, ~40 MB code, ~7.5 MB interned strings;
; admin pages and mcp-adapter add more, so 64 MB / 12 MB leave headroom.
; Only touched pages count towards RSS, unused headroom costs nothing.
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY_CONSUMPTION}
opcache.interned_strings_buffer = 12
opcache.max_accelerated_files = 10000
; Code only changes with the image: wp-entrypoint.sh syncs core + bundled
; wp-content before Apache starts. Set PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 when
; editing code in a running container (docker-compose dev).
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 60
; WordPress gains nothing measurable from JIT; do not reserve its buffer.
opcache.jit = disable
opcache.jit_buffer_size = 0
