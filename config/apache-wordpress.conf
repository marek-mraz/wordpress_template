# Image defaults for Apache. Loaded from conf-enabled/, i.e. after the stock
# mods-enabled/mpm_prefork.conf and security.conf (these win), and before the
# chart's conf-enabled/zz-chart.conf (chart wins).

ServerName localhost

# --- no version / signature leaks
ServerTokens Prod
ServerSignature Off
TraceEnable Off
# Slow clients cannot pin one of the few prefork workers for 300 s (default).
Timeout 60

# --- prefork sized for one small site per pod (env-overridable, see Dockerfile)
<IfModule mpm_prefork_module>
    StartServers            ${APACHE_START_SERVERS}
    MinSpareServers         ${APACHE_MIN_SPARE_SERVERS}
    MaxSpareServers         ${APACHE_MAX_SPARE_SERVERS}
    MaxRequestWorkers       ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild  ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>

# --- security headers (HSTS belongs on the TLS edge, not here)
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always unset X-Powered-By

<Directory /var/www/html>
    # Version leaks, config templates, logs (the chart writes setup-wp.log
    # into the docroot), composer metadata, and XML-RPC (disabled in harden.php).
    <FilesMatch "^(readme\.html|license\.txt|wp-config.*\.php|xmlrpc\.php|composer\.(json|lock)|.*\.(log|sql|sh|bak))$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory /var/www/html/vendor>
    Require all denied
</Directory>

<Directory /var/www/html/wp-content/uploads>
    # Never execute code from the writable uploads dir.
    <FilesMatch "(?i)\.(php\d?|phar|phtml|pht)$">
        Require all denied
    </FilesMatch>
    # A missing upload is a plain 404, not a full WordPress boot.
    RewriteEngine Off
</Directory>

# --- browser caching for static assets (WP versions enqueued assets with ?ver=)
ExpiresActive On
ExpiresByType image/jpeg "access plus 30 days"
ExpiresByType image/png "access plus 30 days"
ExpiresByType image/gif "access plus 30 days"
ExpiresByType image/webp "access plus 30 days"
ExpiresByType image/avif "access plus 30 days"
ExpiresByType image/svg+xml "access plus 30 days"
ExpiresByType image/x-icon "access plus 30 days"
ExpiresByType image/vnd.microsoft.icon "access plus 30 days"
ExpiresByType font/woff2 "access plus 1 year"
ExpiresByType font/woff "access plus 1 year"
ExpiresByType font/ttf "access plus 1 year"
ExpiresByType application/vnd.ms-fontobject "access plus 1 year"
ExpiresByType text/css "access plus 7 days"
ExpiresByType text/javascript "access plus 7 days"
ExpiresByType application/javascript "access plus 7 days"
AddOutputFilterByType DEFLATE image/svg+xml
