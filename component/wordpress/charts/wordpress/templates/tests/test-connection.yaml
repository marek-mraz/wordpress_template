apiVersion: v1
kind: Pod
metadata:
  name: {{ include "wordpress.fullname" . }}-test-connection
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
  containers:
    - name: test-http
      image: {{ .Values.app.busyboxImage }}
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - |
          # REST index: needs PHP and the database, no redirect to the OIDC login
          wget -qO- --timeout=10 'http://{{ include "wordpress.fullname" . }}-web:8080/index.php?rest_route=/' | grep -q '"namespaces"' && echo "WordPress HTTP: OK"
