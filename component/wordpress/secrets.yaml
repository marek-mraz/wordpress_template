{{- range $id, $instance := .Values.global.instances }}
{{- if eq $instance.component "wordpress" }}
wordpress-{{ $id }}:
  app:
    wordpress-{{ $id }}-credentials:
      mariadb-root-password:
        length: 32
        generate: true
      mariadb-password:
        length: 32
        generate: true
      wordpress-password:
        length: 24
        generate: true
      componentNamespaces:
        - wordpress-{{ $id }}
{{- end }}
{{- end }}
