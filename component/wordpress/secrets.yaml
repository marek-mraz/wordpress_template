{{- range $id, $instance := .Values.global.instances }}
{{- if eq $instance.component "wordpress" }}
wordpress-{{ $id }}:
  app:
    wordpress-{{ $id }}-credentials:
      mariadb-root-password:
        length: 32
        generate: true
      mariadb-password:
        length: 32
        generate: true
      wordpress-password:
        length: 24
        generate: true
      auth-key:
        length: 64
        generate: true
      secure-auth-key:
        length: 64
        generate: true
      logged-in-key:
        length: 64
        generate: true
      nonce-key:
        length: 64
        generate: true
      auth-salt:
        length: 64
        generate: true
      secure-auth-salt:
        length: 64
        generate: true
      logged-in-salt:
        length: 64
        generate: true
      nonce-salt:
        length: 64
        generate: true
      componentNamespaces:
        - wordpress-{{ $id }}
{{- end }}
{{- end }}
