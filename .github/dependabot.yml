version: 2
updates:
  # 1. Check composer packages (wpackagist plugins, composer.lock)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"
    # supply-chain cooldown: only propose releases at least 7 days old
    cooldown:
      default-days: 7

  # 2. Check Dockerfiles (wordpress + composer base images)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    # supply-chain cooldown: only propose releases at least 7 days old
    cooldown:
      default-days: 7

  # 3. Check GitHub Actions (pinned SHAs in .github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # supply-chain cooldown: only propose releases at least 7 days old
    cooldown:
      default-days: 7
